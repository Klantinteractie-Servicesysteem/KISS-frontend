# yaml-language-server: $schema=./values.schema.json

#
replicaCount: 2

image:
  repository: "ghcr.io/klantinteractie-servicesysteem/kiss-frontend"
  pullPolicy: IfNotPresent
  # -- (string) Image tag. Consider leaving this empty because it defaults to the recommended version of the image to use with this chart.
  # @default -- The semantic version of the chart
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10000

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- (list) ingress hosts
  hosts: []
  #  - host: kiss-frontend.gemeente.nl
  #    paths:
  #      - path: /
  #        pathType: ImplementationSpecific
  tls: []
  #  - secretName: kiss-frontend-tls
  #    hosts:
  #      - kiss-frontend.gemeente.nl

# -- (list) Specify extra ingresses, for example if you have multiple ingress classes
extraIngress: []
# e.g:
# extraIngress:
#  - name: kiss-frontend-azuregateway
#    annotations:
#      appgw.ingress.kubernetes.io/ssl-redirect: "true"
#    className: azure-application-gateway
#    hosts:
#      - host: kiss-frontend.gemeente.nl
#        paths:
#          - path: /
#            pathType: ImplementationSpecific
#            servicename: kiss-frontend
#            portNumber: 8000
#    tls:
#      - secretName: kiss-frontend-tls
#        hosts:
#          - "kiss-frontend.gemeente.nl"

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  create: false
  minAvailable: 1
  maxUnavailable: ""

nodeSelector: {}

tolerations: []

affinity: {}

# @schema
# required: true
# @schema
settings:
  aspnetcore:
    # -- (bool) Process `X-Forwarded-*` headers set by the ingress / reverse proxy. Keep this `true` when KISS runs behind an ingress.<br/>Env: `ASPNETCORE_FORWARDEDHEADERS_ENABLED`
    # @section -- ASP.NET Core
    forwardedHeadersEnabled: true
    # -- (string) ASP.NET Core environment name.<br/>Env: `ASPNETCORE_ENVIRONMENT`
    # @section -- ASP.NET Core
    environment: "Production"
    # -- (string) Port(s) the KISS container listens on. Leave empty to use the default of the image.<br/>Env: `ASPNETCORE_HTTP_PORTS`
    # @section -- ASP.NET Core
    httpPorts: ""

  # @schema
  # required: true
  # @schema
  afdelingen:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Objects API for afdelingen.<br/>Example: `https://objectenregister.mijngemeente.nl`<br/>Env: `AFDELINGEN_BASE_URL`
    # @section -- Afdelingen and groepen
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the afdelingen Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/f83fdc48-5ddb-4b1a-a347-e20092031399`<br/>Env: `AFDELINGEN_OBJECT_TYPE_URL`
    # @section -- Afdelingen and groepen
    objectTypeUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Token of the Objects API for afdelingen.<br/>Env: `AFDELINGEN_TOKEN`
    # @section -- Afdelingen and groepen
    token: ""

  # @schema
  # required: true
  # @schema
  database:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Name of the PostgreSQL database used by KISS.<br/>Env: `POSTGRES_DB`
    # @section -- Database
    name: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Host of the database used by KISS.<br/>Env: `POSTGRES_HOST`
    # @section -- Database
    host: ""
    # -- (int) Port of the database used by KISS.<br/>Env: `POSTGRES_PORT`
    # @section -- Database
    port: 5432
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Username for KISS to access the database.<br/>Env: `POSTGRES_USER`
    # @section -- Database
    username: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Password of the database user.<br/>Env: `POSTGRES_PASSWORD`
    # @section -- Database
    password: ""

  # @schema
  # required: true
  # @schema
  elastic:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) The URL for Elasticsearch. Used by KISS and by the sync jobs.<br/>Example: `https://kiss-es-http:9200`<br/>Env: `ELASTIC_BASE_URL`
    # @section -- Elasticsearch
    baseUrl: ""
    # @schema
    # type: array
    # items:
    #   type: string
    #   minLength: 1
    # @schema
    # -- (list) Fields that a Kennisbank user is not allowed to search and view. Specify the field names as they are configured in Elasticsearch.<br/>Example: `["VAC.toelichting", "Kennisbank.vertalingen.deskMemo"]`<br/>Env: `ELASTIC_EXCLUDED_FIELDS_KENNISBANK` (comma separated)
    # @section -- Elasticsearch
    excludedFieldsKennisbank: []
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Username to log in to Elasticsearch. This can be the default root user `elastic`, or a user you created yourself.<br/>Env: `ELASTIC_USERNAME`
    # @section -- Elasticsearch
    username: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Password to log in to Elasticsearch.<br/>Env: `ELASTIC_PASSWORD`
    # <details><summary>More information</summary>If you use [ECK](https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-overview.html), you can find the password of the default user with `kubectl get secret kiss-es-elastic-user -o go-template='{{.data.elastic \| base64decode}}'`</details>
    # @section -- Elasticsearch
    password: ""

    # -- (int) The timeout in minutes for bulk indexing operations to Elasticsearch. Adjust this if you have a very large source and you experience timeouts during sync jobs.<br/>Env: `ELASTIC_BULK_HTTP_TIMEOUT_MINUTES` (only used by the sync jobs)
    # @section -- Elasticsearch
    bulkHttpTimeoutMinutes: 10

    # -- (bool) Controls whether SSL certificate verification is enabled. Defaults to false because elasticsearch clusters are often internal and use self-signed certificates.<br/>Only used by the website crawler and the index template hook, there is no environment variable for this setting.
    # @section -- Elasticsearch
    sslVerify: false

  # @schema
  # required: true
  # @schema
  email:
    # -- (bool) Use SSL for the connection with the mail server.<br/>Env: `EMAIL_ENABLE_SSL`
    # @section -- Feedback on kennisartikelen
    enableSsl: true
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Address of the mail server.<br/>Env: `EMAIL_HOST`
    # @section -- Feedback on kennisartikelen
    host: ""
    # -- (string) Password for the mail server.<br/>Env: `EMAIL_PASSWORD`
    # @section -- Feedback on kennisartikelen
    password: ""
    # -- (int) Port number of the mail connection.<br/>Env: `EMAIL_PORT`
    # @section -- Feedback on kennisartikelen
    port: 25
    # -- (string) Username for the mail server.<br/>Env: `EMAIL_USERNAME`
    # @section -- Feedback on kennisartikelen
    username: ""

  # @schema
  # required: true
  # @schema
  feedback:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) From address of the feedback email. A KCM can give feedback on a kennisartikel from KISS; this feedback is emailed to one central address.<br/>Env: `FEEDBACK_EMAIL_FROM`
    # @section -- Feedback on kennisartikelen
    emailFrom: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Address where the feedback email should be sent.<br/>Env: `FEEDBACK_EMAIL_TO`
    # @section -- Feedback on kennisartikelen
    emailTo: ""

  # @schema
  # required: true
  # @schema
  groepen:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Objects API for groepen.<br/>Example: `https://objectenregister.mijngemeente.nl`<br/>Env: `GROEPEN_BASE_URL`
    # @section -- Afdelingen and groepen
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the groepen Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/f83fdc48-5ddb-4b1a-a347-e20092031399`<br/>Env: `GROEPEN_OBJECT_TYPE_URL`
    # @section -- Afdelingen and groepen
    objectTypeUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Token of the Objects API for groepen.<br/>Env: `GROEPEN_TOKEN`
    # @section -- Afdelingen and groepen
    token: ""

  # @schema
  # required: true
  # @schema
  haalCentraal:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Haal Centraal BRP Personen API.<br/>Example: `https://proefomgeving.haalcentraal.nl/haalcentraal/api`<br/>Env: `HAAL_CENTRAAL_BASE_URL`
    # @section -- BRP (Haal Centraal) and KvK
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Key for the Haal Centraal API.<br/>Env: `HAAL_CENTRAAL_API_KEY`
    # @section -- BRP (Haal Centraal) and KvK
    apiKey: ""
    # -- (string) Header name to include the user id to send to the Haal Centraal API, for instance when using a proxy. The value of the claim configured in `settings.oidc.medewerkerIdentificatie.claim` is sent. See [Using KISS with a proxy for BRP / KvK](#using-kiss-with-a-proxy-for-brp--kvk-for-example-iconnect).<br/>Env: `HAAL_CENTRAAL_USER_HEADER_NAME`
    # @section -- BRP (Haal Centraal) and KvK
    userHeaderName: ""
    # @schema
    # additionalProperties:
    #   oneOf:
    #     - type: string
    #     - type: object
    #       properties:
    #         RaadpleegMetBurgerservicenummer:
    #           type: string
    #         ZoekMetGeslachtsnaamEnGeboortedatum:
    #           type: string
    #         ZoekMetPostcodeEnHuisnummer:
    #           type: string
    #       required: [RaadpleegMetBurgerservicenummer, ZoekMetGeslachtsnaamEnGeboortedatum, ZoekMetPostcodeEnHuisnummer]
    # @schema
    # -- (object) Custom headers to send to the Haal Centraal API, for instance when using a proxy. A value can be a string (sent with every search) or an object with a value per search type. See [Using KISS with a proxy for BRP / KvK](#using-kiss-with-a-proxy-for-brp--kvk-for-example-iconnect).<br/>Env: `HAAL_CENTRAAL_CUSTOM_HEADERS__<headername>` and `HAAL_CENTRAAL_CUSTOM_HEADERS__<headername>__<zoektype>`
    # @section -- BRP (Haal Centraal) and KvK
    customHeaders: {}

  # @schema
  # required: true
  # @schema
  kvk:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the KvK API to query the Handelsregister. This is the path before the version number.<br/>Example: `https://api.kvk.nl/test/api`<br/>Env: `KVK_BASE_URL`
    # @section -- BRP (Haal Centraal) and KvK
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Key for the KvK API.<br/>Env: `KVK_API_KEY`
    # @section -- BRP (Haal Centraal) and KvK
    apiKey: ""
    # -- (string) Header name to include the user id to send to the KvK API, for instance when using a proxy. The value of the claim configured in `settings.oidc.medewerkerIdentificatie.claim` is sent.<br/>Env: `KVK_USER_HEADER_NAME`
    # @section -- BRP (Haal Centraal) and KvK
    userHeaderName: ""
    # @schema
    # additionalProperties:
    #   type: string
    # @schema
    # -- (object) Custom headers to send to the KvK API, for instance when using a proxy. See [Using KISS with a proxy for BRP / KvK](#using-kiss-with-a-proxy-for-brp--kvk-for-example-iconnect).<br/>Env: `KVK_CUSTOM_HEADERS__<headername>`
    # @section -- BRP (Haal Centraal) and KvK
    customHeaders: {}

  # @schema
  # required: true
  # @schema
  logboek:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Objects API where the logbook is stored. See [Logboek](#when-to-configure-the-logboek).<br/>Env: `LOGBOEK_BASE_URL`
    # @section -- Logboek (ITA)
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Logboek Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/12345678-5ddb-4b1a-a347-e20092031399`<br/>Env: `LOGBOEK_OBJECT_TYPE_URL`
    # @section -- Logboek (ITA)
    objectTypeUrl: ""
    # @schema
    # required: true
    # @schema
    # -- (int) Version number of the Logboek Object Type.<br/>Env: `LOGBOEK_OBJECT_TYPE_VERSION`
    # @section -- Logboek (ITA)
    objectTypeVersion: 1
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Token for the Objects API for the Logboek.<br/>Env: `LOGBOEK_TOKEN`
    # @section -- Logboek (ITA)
    token: ""

  managementInformatie:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Secret that KISS uses to validate the JWT Token when requesting contactmoment details. See the [managementinformatie chapter of the KISS manual](https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/manual/managementinformatie.html) on how to use this API.<br/>Env: `MANAGEMENTINFORMATIE_API_KEY`
    # @section -- Authentication and authorization
    apiKey: ""

  pabc:
    # -- (string) Base URL of the PABC API, without trailing slash. Example: `https://pabc.mijngemeente.nl`.<br/>Setting both `baseUrl` and `apiKey` activates the PABC integration. See [PABC](#pabc-platform-autorisatie-beheer-component).<br/>Env: `PABC_BASE_URL`
    # @section -- PABC
    baseUrl: ""
    # -- (string) API key for authentication with PABC (sent as `X-API-KEY` header).<br/>Env: `PABC_API_KEY`
    # @section -- PABC
    apiKey: ""

  # @schema
  # required: true
  # @schema
  oidc:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the OpenID Connect Identity Provider.<br/>Env: `OIDC_AUTHORITY`
    # @section -- Authentication and authorization
    authority: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Client ID for access to the OpenID Connect Identity Provider.<br/>Env: `OIDC_CLIENT_ID`
    # @section -- Authentication and authorization
    clientId: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Secret for the OpenID Connect Identity Provider.<br/>Env: `OIDC_CLIENT_SECRET`
    # @section -- Authentication and authorization
    clientSecret: ""
    # -- (string) Name of the role for a Kennisbank employee. Must match the name of the role in the Identity Provider. Default: `Kennisbank`. A user with this role can only search the configured sources (Kennisbank, VAC, Smoelenboek, websites).<br/>When [PABC](#pabc-platform-autorisatie-beheer-component) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_KENNISBANK_ROLE`
    # @section -- Authentication and authorization
    kennisbankRole: ""
    # -- (string) Name of the role for a Klantcontactmedewerker (KCM). Must match the name of the role in the Identity Provider. Default: `Klantcontactmedewerker`. A user with this role can register contactmomenten and contactverzoeken, and search the sources.<br/>When [PABC](#pabc-platform-autorisatie-beheer-component) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_KLANTCONTACTMEDEWERKER_ROLE`
    # @section -- Authentication and authorization
    klantcontactmedewerkerRole: ""
    # @schema
    # required: true
    # @schema
    medewerkerIdentificatie:
      # @schema
      # required: true
      # type: string
      # minLength: 1
      # @schema
      # -- (string) The claim used to identify the medewerker in the registers. Default: `email`.<br/>Env: `OIDC_MEDEWERKER_IDENTIFICATIE_CLAIM`
      # <details><summary>More information</summary>When writing data to e.g. Open Klant or Open Zaak, a `medewerkerIdentificatie.identificatie` is required. Municipalities use different values for this. When integrating with e.g. the e-Suite, this must contain the e-Suite username of the logged in KCM.</details>
      # @section -- Authentication and authorization
      claim: ""
      # @schema
      # type: [integer, null]
      # @schema
      # -- Optional maximum number of characters of the claim, after which it is truncated. Example: `24`. Default: no truncation.<br/>Env: `OIDC_MEDEWERKER_IDENTIFICATIE_TRUNCATE`
      # <details><summary>More information</summary>Within ZGW, a `medewerkerIdentificatie.identificatie` may not be longer than 24 characters. Use this setting to truncate the value after 24 characters.</details>
      # @section -- Authentication and authorization
      truncate:
    # -- (string) Name of the role for a Redacteur. Must match the name of the role in the Identity Provider. Default: `Redacteur`. A user with this role can edit Nieuws- en Werkberichten, Links and VACs (if configured). See the [KISS manual](https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/manual/manual.html).<br/>When [PABC](#pabc-platform-autorisatie-beheer-component) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_REDACTEUR_ROLE`
    # @section -- Authentication and authorization
    redacteurRole: ""
    # -- (string) Name of the role for a Beheerder. Must match the name of the role in the Identity Provider. Default: `Beheerder`. A user with this role can edit Skills, Kanalen, Gespreksresultaten and Contactverzoek formulieren. See the [KISS manual](https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/manual/manual.html).<br/>When [PABC](#pabc-platform-autorisatie-beheer-component) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_BEHEERDER_ROLE`
    # @section -- Authentication and authorization
    beheerderRole: ""

  # @schema
  # type: array
  # required: true
  # items:
  #   type: string
  # minItems: 1
  # @schema
  # -- (list) RSIN of the organisation that registers the contactmomenten. Several ZGW APIs, including the Klanten and Contactmomenten APIs, require the RSIN of the own organisation when registering specific objects.<br/>Env: `ORGANISATIE_IDS` (separated by `/`)
  # @section -- Organisation
  organisatieIds: []

  # @schema
  # required: true
  # type: array
  # minItems: 1
  # items:
  #   properties: {}
  #   allOf:
  #     - description: Common register configuration
  #       properties:
  #         isDefault:
  #           type: boolean
  #         zaaksysteem:
  #           properties:
  #             clientId:
  #               type: string
  #               minLength: 1
  #             clientSecret:
  #               type: string
  #               minLength: 1
  #             catalogiBaseUrl:
  #               type: string
  #               minLength: 1
  #             documentenBaseUrl:
  #               type: string
  #               minLength: 1
  #             zakenBaseUrl:
  #               type: string
  #               minLength: 1
  #             deeplink:
  #               properties:
  #                 property:
  #                   type: string
  #                 url:
  #                   type: string
  #             useExperimentalQueries:
  #               type: boolean
  #             usePabc:
  #               type: boolean
  #           required: [clientId, clientSecret, catalogiBaseUrl, documentenBaseUrl, zakenBaseUrl]
  #       required: ["zaaksysteem"]
  #     - oneOf:
  #       - description: Oud (esuite) register configuration
  #         properties:
  #           contactmomenten:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               clientId:
  #                 type: string
  #               clientSecret:
  #                 type: string
  #             required: ["baseUrl", "clientId", "clientSecret"]
  #           interneTaak:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               clientId:
  #                 type: string
  #               clientSecret:
  #                 type: string
  #               objectTypeUrl:
  #                 type: string
  #               objectTypeVersion:
  #                 type: integer
  #             required: ["baseUrl", "clientId", "clientSecret", "objectTypeUrl", "objectTypeVersion"]
  #           klanten:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               clientId:
  #                 type: string
  #               clientSecret:
  #                 type: string
  #             required: ["baseUrl", "clientId", "clientSecret"]
  #         required: ["contactmomenten", "interneTaak", "klanten"]
  #       - description: Nieuw (klantinteracties) register configuration
  #         properties:
  #           klantinteractie:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               token:
  #                 type: string
  #             required: ["baseUrl", "token"]
  #         required: ["klantinteractie"]
  # @schema
  # -- (list) Configuration for the different sets of registers for e.g. zaken and klantcontacten. See [Registers](#registers-configuration) for the fields of each item, and [the json schema](./values.schema.json) for the possible configurations.<br/>Env: `REGISTERS__<n>__…`
  # @section -- Registers
  registers: []

  # -- (bool) Determines whether a medewerker must be linked to a contactverzoek when the selected afdeling or groep has no groepsmailbox.<br/>Env: `USE_GROEPSMAILBOX_VERPLICHTING`
  # <details><summary>More information</summary>When `true`, the medewerker field becomes required (with a visible reason) if no email address is known for the selected afdeling or groep. A contactverzoek can then not be created without a medewerker. When `false`, the medewerker field stays optional, regardless of the groepsmailbox.</details>
  # @section -- Feature switches
  groepsmailboxVerplichting: false

  syncJobs:
    image:
      # -- (string) The image repository for the `kiss-elastic-sync` sync jobs
      # @section -- Sync jobs
      repository: "ghcr.io/klantinteractie-servicesysteem/kiss-elastic-sync"
      # -- (string) Pull policy for the `kiss-elastic-sync` image
      # @section -- Sync jobs
      pullPolicy: IfNotPresent
      # -- (string) The tag for the `kiss-elastic-sync` image to use for sync jobs. Consider leaving this empty because it will default to the recommended version to use with the chart.
      # @section -- Sync jobs
      tag: ""
    crawlerImage:
      # -- (string) The image repository for the Elastic Open Crawler
      # @section -- Sync jobs
      repository: "docker.elastic.co/integrations/crawler"
      # -- (string) The tag for the Open Crawler image
      # @section -- Sync jobs
      tag: "1.0.0"
