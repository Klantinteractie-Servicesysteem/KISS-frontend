    # @schema
    # items:
    #   type: object
    #   properties:
    #     sourceName:
    #       type: string
    #     schedule:
    #       type: string
    #     historyLimit:
    #       type: integer
    #     resources:
    #       type: object
    #     siteUrl:
    #       type: string
    #     clientId:
    #       type: string
    #     clientSecret:
