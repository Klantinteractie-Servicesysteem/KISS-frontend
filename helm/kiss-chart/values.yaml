# yaml-language-server: $schema=./values.schema.json

#
replicaCount: 2

image:
  repository: "ghcr.io/klantinteractie-servicesysteem/kiss-frontend"
  pullPolicy: IfNotPresent
  # -- (string) Image tag. Consider leaving this empty because it defaults to the recommended version of the image to use with this chart.
  # @default -- The semantic version of the chart
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10000

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- (list) ingress hosts
  hosts: []
  #  - host: kiss-frontend.gemeente.nl
  #    paths:
  #      - path: /
  #        pathType: ImplementationSpecific
  tls: []
  #  - secretName: kiss-frontend-tls
  #    hosts:
  #      - kiss-frontend.gemeente.nl

# -- (list) Specify extra ingresses, for example if you have multiple ingress classes
extraIngress: []
# e.g:
# extraIngress:
#  - name: kiss-frontend-azuregateway
#    annotations:
#      appgw.ingress.kubernetes.io/ssl-redirect: "true"
#    className: azure-application-gateway
#    hosts:
#      - host: kiss-frontend.gemeente.nl
#        paths:
#          - path: /
#            pathType: ImplementationSpecific
#            servicename: kiss-frontend
#            portNumber: 8000
#    tls:
#      - secretName: kiss-frontend-tls
#        hosts:
#          - "kiss-frontend.gemeente.nl"

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  create: false
  minAvailable: 1
  maxUnavailable: ""

nodeSelector: {}

tolerations: []

affinity: {}

# @schema
# required: true
# @schema
settings:
  aspnetcore:
    # -- (bool) Process `X-Forwarded-*` headers set by the ingress / reverse proxy. Keep this `true` when KISS runs behind an ingress.<br/>Env: `ASPNETCORE_FORWARDEDHEADERS_ENABLED`
    # @section -- ASP.NET Core
    forwardedHeadersEnabled: true
    # -- (string) ASP.NET Core environment name.<br/>Env: `ASPNETCORE_ENVIRONMENT`
    # @section -- ASP.NET Core
    environment: "Production"
    # -- (string) Port(s) the KISS container listens on. Leave this empty: the chart uses container port `8080` (also for the probes and the service), which is the default of the image. If you do set it, it must include `8080`, otherwise the probes fail.<br/>Env: `ASPNETCORE_HTTP_PORTS`
    # @section -- ASP.NET Core
    httpPorts: ""

  # @schema
  # required: true
  # @schema
  afdelingen:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Objects API for afdelingen.<br/>Example: `https://objectenregister.mijngemeente.nl`<br/>Env: `AFDELINGEN_BASE_URL`
    # @section -- Afdelingen and groepen
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the afdelingen Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/f83fdc48-5ddb-4b1a-a347-e20092031399`<br/>Env: `AFDELINGEN_OBJECT_TYPE_URL`
    # @section -- Afdelingen and groepen
    objectTypeUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Token of the Objects API for afdelingen.<br/>Env: `AFDELINGEN_TOKEN`
    # @section -- Afdelingen and groepen
    token: ""

  # @schema
  # required: true
  # @schema
  database:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Name of the PostgreSQL database used by KISS.<br/>Env: `POSTGRES_DB`
    # @section -- Database
    name: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Host of the database used by KISS.<br/>Env: `POSTGRES_HOST`
    # @section -- Database
    host: ""
    # -- (int) Port of the database used by KISS.<br/>Env: `POSTGRES_PORT`
    # @section -- Database
    port: 5432
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Username for KISS to access the database.<br/>Env: `POSTGRES_USER`
    # @section -- Database
    username: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Password of the database user.<br/>Env: `POSTGRES_PASSWORD`
    # @section -- Database
    password: ""

  # @schema
  # required: true
  # @schema
  elastic:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) The URL for Elasticsearch. Used by KISS and by the sync jobs.<br/>Example: `https://kiss-es-http:9200`<br/>Env: `ELASTIC_BASE_URL`
    # @section -- Elasticsearch
    baseUrl: ""
    # @schema
    # type: array
    # items:
    #   type: string
    #   minLength: 1
    # @schema
    # -- (list) Fields that a Kennisbank user is not allowed to search and view. Specify the field names as they are configured in Elasticsearch.<br/>Example: `["VAC.toelichting", "Kennisbank.vertalingen.deskMemo"]`<br/>Env: `ELASTIC_EXCLUDED_FIELDS_KENNISBANK` (comma separated)
    # @section -- Elasticsearch
    excludedFieldsKennisbank: []
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Username to log in to Elasticsearch. This can be the default root user `elastic`, or a user you created yourself.<br/>Env: `ELASTIC_USERNAME`
    # @section -- Elasticsearch
    username: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Password to log in to Elasticsearch.<br/>Env: `ELASTIC_PASSWORD`
    # <details><summary>More information</summary>If you use [ECK](https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-overview.html), you can find the password of the default user with `kubectl get secret kiss-es-elastic-user -o go-template='{{.data.elastic \| base64decode}}'`</details>
    # @section -- Elasticsearch
    password: ""

    # -- (int) The timeout in minutes for bulk indexing operations to Elasticsearch. Adjust this if you have a very large source and you experience timeouts during sync jobs.<br/>Env: `ELASTIC_BULK_HTTP_TIMEOUT_MINUTES` (only used by the sync jobs)
    # @section -- Elasticsearch
    bulkHttpTimeoutMinutes: 10

    # -- (bool) Controls whether SSL certificate verification is enabled. Defaults to false because elasticsearch clusters are often internal and use self-signed certificates.<br/>Only used by the website crawler and the index template hook, there is no environment variable for this setting.
    # @section -- Elasticsearch
    sslVerify: false

  # @schema
  # required: true
  # @schema
  email:
    # -- (bool) Use SSL for the connection with the mail server.<br/>Env: `EMAIL_ENABLE_SSL`
    # @section -- Feedback on kennisartikelen
    enableSsl: true
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Address of the mail server.<br/>Env: `EMAIL_HOST`
    # @section -- Feedback on kennisartikelen
    host: ""
    # -- (string) Password for the mail server.<br/>Env: `EMAIL_PASSWORD`
    # @section -- Feedback on kennisartikelen
    password: ""
    # -- (int) Port number of the mail connection.<br/>Env: `EMAIL_PORT`
    # @section -- Feedback on kennisartikelen
    port: 25
    # -- (string) Username for the mail server.<br/>Env: `EMAIL_USERNAME`
    # @section -- Feedback on kennisartikelen
    username: ""

  # @schema
  # required: true
  # @schema
  feedback:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) From address of the feedback email. A KCM can give feedback on a kennisartikel from KISS; this feedback is emailed to one central address.<br/>Env: `FEEDBACK_EMAIL_FROM`
    # @section -- Feedback on kennisartikelen
    emailFrom: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Address where the feedback email should be sent.<br/>Env: `FEEDBACK_EMAIL_TO`
    # @section -- Feedback on kennisartikelen
    emailTo: ""

  # @schema
  # required: true
  # @schema
  groepen:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Objects API for groepen.<br/>Example: `https://objectenregister.mijngemeente.nl`<br/>Env: `GROEPEN_BASE_URL`
    # @section -- Afdelingen and groepen
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the groepen Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/f83fdc48-5ddb-4b1a-a347-e20092031399`<br/>Env: `GROEPEN_OBJECT_TYPE_URL`
    # @section -- Afdelingen and groepen
    objectTypeUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Token of the Objects API for groepen.<br/>Env: `GROEPEN_TOKEN`
    # @section -- Afdelingen and groepen
    token: ""

  # @schema
  # required: true
  # @schema
  haalCentraal:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Haal Centraal BRP Personen API.<br/>Example: `https://proefomgeving.haalcentraal.nl/haalcentraal/api`<br/>Env: `HAAL_CENTRAAL_BASE_URL`
    # @section -- BRP (Haal Centraal) and KvK
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Key for the Haal Centraal API.<br/>Env: `HAAL_CENTRAAL_API_KEY`
    # @section -- BRP (Haal Centraal) and KvK
    apiKey: ""
    # -- (string) Header name to include the user id to send to the Haal Centraal API, for instance when using a proxy. The value of the claim configured in `settings.oidc.medewerkerIdentificatie.claim` is sent. See `settings.haalCentraal.customHeaders` for an example.<br/>Env: `HAAL_CENTRAAL_USER_HEADER_NAME`
    # @section -- BRP (Haal Centraal) and KvK
    userHeaderName: ""
    # @schema
    # additionalProperties:
    #   oneOf:
    #     - type: string
    #     - type: object
    #       properties:
    #         RaadpleegMetBurgerservicenummer:
    #           type: string
    #         ZoekMetGeslachtsnaamEnGeboortedatum:
    #           type: string
    #         ZoekMetPostcodeEnHuisnummer:
    #           type: string
    #       required: [RaadpleegMetBurgerservicenummer, ZoekMetGeslachtsnaamEnGeboortedatum, ZoekMetPostcodeEnHuisnummer]
    # @schema
    # -- (object) Custom headers to send to the Haal Centraal API, for instance when using a proxy such as iConnect. A value can be a string (sent with every search) or an object with a value per search type: `RaadpleegMetBurgerservicenummer`, `ZoekMetGeslachtsnaamEnGeboortedatum` or `ZoekMetPostcodeEnHuisnummer`.<br/>Env: `HAAL_CENTRAAL_CUSTOM_HEADERS__<headername>` and `HAAL_CENTRAAL_CUSTOM_HEADERS__<headername>__<zoektype>`
    # <details><summary>Using KISS with a proxy for BRP / KvK (for example iConnect)</summary>Proxies for the BRP and KvK often require certain headers. To pass the identification of the logged in user in a header, use `userHeaderName` (here and in `settings.kvk`); the value sent is the claim configured in `settings.oidc.medewerkerIdentificatie.claim`. To pass static information, use `customHeaders` (here and in `settings.kvk`). For the BRP, a header can have a different value per search type. Example for iConnect:
    # <pre>settings:<br/>  haalCentraal:<br/>    userHeaderName: x-gebruiker<br/>    customHeaders:<br/>      x-verwerking: Burgerzaken<br/>      x-doelbinding:<br/>        RaadpleegMetBurgerservicenummer: BRPACT-Totaal<br/>        ZoekMetGeslachtsnaamEnGeboortedatum: BRPACT-ZoekenAlgemeen<br/>        ZoekMetPostcodeEnHuisnummer: BRPACT-ZoekenAlgemeen<br/>  kvk:<br/>    customHeaders:<br/>      x-origin-oin: "00000000000000000000"</pre>
    # The same example as environment variables:
    # <pre>HAAL_CENTRAAL_USER_HEADER_NAME=x-gebruiker<br/>HAAL_CENTRAAL_CUSTOM_HEADERS__x-verwerking=Burgerzaken<br/>HAAL_CENTRAAL_CUSTOM_HEADERS__x-doelbinding__RaadpleegMetBurgerservicenummer=BRPACT-Totaal<br/>HAAL_CENTRAAL_CUSTOM_HEADERS__x-doelbinding__ZoekMetGeslachtsnaamEnGeboortedatum=BRPACT-ZoekenAlgemeen<br/>HAAL_CENTRAAL_CUSTOM_HEADERS__x-doelbinding__ZoekMetPostcodeEnHuisnummer=BRPACT-ZoekenAlgemeen<br/>KVK_CUSTOM_HEADERS__x-origin-oin=00000000000000000000</pre>
    # Without helm, a header without search type (e.g. `HAAL_CENTRAAL_CUSTOM_HEADERS__x-doelbinding=BRPACT-ZoekenAlgemeen`) can be combined with a value for one specific search type; the specific value takes precedence for that search type.</details>
    # @section -- BRP (Haal Centraal) and KvK
    customHeaders: {}

  # @schema
  # required: true
  # @schema
  kvk:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the KvK API to query the Handelsregister. This is the path before the version number.<br/>Example: `https://api.kvk.nl/test/api`<br/>Env: `KVK_BASE_URL`
    # @section -- BRP (Haal Centraal) and KvK
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Key for the KvK API.<br/>Env: `KVK_API_KEY`
    # @section -- BRP (Haal Centraal) and KvK
    apiKey: ""
    # -- (string) Header name to include the user id to send to the KvK API, for instance when using a proxy. The value of the claim configured in `settings.oidc.medewerkerIdentificatie.claim` is sent.<br/>Env: `KVK_USER_HEADER_NAME`
    # @section -- BRP (Haal Centraal) and KvK
    userHeaderName: ""
    # @schema
    # additionalProperties:
    #   type: string
    # @schema
    # -- (object) Custom headers to send to the KvK API, for instance when using a proxy. See `settings.haalCentraal.customHeaders` for an example.<br/>Env: `KVK_CUSTOM_HEADERS__<headername>`
    # @section -- BRP (Haal Centraal) and KvK
    customHeaders: {}

  # @schema
  # required: true
  # @schema
  logboek:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Objects API where the logboek is stored.<br/>Env: `LOGBOEK_BASE_URL`
    # <details><summary>About the logboek</summary>The logboek contains information about the handling of a contactverzoek in ITA (Interne Taak Afhandeling). KISS shows this information with the contactverzoeken of a klant. Functionally, the logboek is only used together with ITA. The chart's json schema currently requires `baseUrl`, `objectTypeUrl`, `objectTypeVersion` and `token` to be filled in. KISS itself treats the logboek as optional: only when all four `LOGBOEK_*` environment variables have a value, the logboek is shown.</details>
    # @section -- Logboek (ITA)
    baseUrl: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the Logboek Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/12345678-5ddb-4b1a-a347-e20092031399`<br/>Env: `LOGBOEK_OBJECT_TYPE_URL`
    # @section -- Logboek (ITA)
    objectTypeUrl: ""
    # @schema
    # required: true
    # @schema
    # -- (int) Version number of the Logboek Object Type.<br/>Env: `LOGBOEK_OBJECT_TYPE_VERSION`
    # @section -- Logboek (ITA)
    objectTypeVersion: 1
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Token for the Objects API for the Logboek.<br/>Env: `LOGBOEK_TOKEN`
    # @section -- Logboek (ITA)
    token: ""

  managementInformatie:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Secret that KISS uses to validate the JWT Token when requesting contactmoment details. See the [managementinformatie chapter of the KISS manual](https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/manual/managementinformatie.html) on how to use this API.<br/>Env: `MANAGEMENTINFORMATIE_API_KEY`
    # @section -- Authentication and authorization
    apiKey: ""

  pabc:
    # -- (string) Base URL of the PABC API, without trailing slash. Example: `https://pabc.mijngemeente.nl`.<br/>Setting both `baseUrl` and `apiKey` activates the PABC integration.<br/>Env: `PABC_BASE_URL`
    # <details><summary>About PABC (Platform Autorisatie Beheer Component)</summary>The integration with <a href="https://github.com/Platform-Autorisatie-Beheer-Component/PABC-API">PABC</a> is optional. When both `baseUrl` and `apiKey` are set, the integration is activated. The application name `kiss` is hardcoded in KISS.<br/><br/>When PABC is active, the roles of a user come from PABC instead of the role claims of the Identity Provider. KISS only accepts PABC application roles whose names match the role names in `settings.oidc` (`klantcontactmedewerkerRole`, `redacteurRole`, `beheerderRole`, `kennisbankRole`). Leave those settings empty (KISS then uses the default names `Klantcontactmedewerker`, `Redacteur`, `Beheerder` and `Kennisbank`), or make sure the application roles in PABC have exactly the configured names.<br/><br/>Set up PABC first, and only then deploy KISS with the PABC configuration. Otherwise no user gets a KISS application role. See the <a href="https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/installation/pabc.html">PABC documentation</a> for setup instructions.</details>
    # @section -- PABC
    baseUrl: ""
    # -- (string) API key for authentication with PABC (sent as `X-API-KEY` header).<br/>Env: `PABC_API_KEY`
    # @section -- PABC
    apiKey: ""

  # @schema
  # required: true
  # @schema
  oidc:
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) URL of the OpenID Connect Identity Provider.<br/>Env: `OIDC_AUTHORITY`
    # @section -- Authentication and authorization
    authority: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Client ID for access to the OpenID Connect Identity Provider.<br/>Env: `OIDC_CLIENT_ID`
    # @section -- Authentication and authorization
    clientId: ""
    # @schema
    # required: true
    # minLength: 1
    # @schema
    # -- (string) Secret for the OpenID Connect Identity Provider.<br/>Env: `OIDC_CLIENT_SECRET`
    # @section -- Authentication and authorization
    clientSecret: ""
    # -- (string) Name of the role for a Kennisbank employee. Must match the name of the role in the Identity Provider. Default: `Kennisbank`. A user with this role can only search the configured sources (Kennisbank, VAC, Smoelenboek, websites).<br/>When PABC (`settings.pabc`) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_KENNISBANK_ROLE`
    # @section -- Authentication and authorization
    kennisbankRole: ""
    # -- (string) Name of the role for a Klantcontactmedewerker (KCM). Must match the name of the role in the Identity Provider. Default: `Klantcontactmedewerker`. A user with this role can register contactmomenten and contactverzoeken, and search the sources.<br/>When PABC (`settings.pabc`) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_KLANTCONTACTMEDEWERKER_ROLE`
    # @section -- Authentication and authorization
    klantcontactmedewerkerRole: ""
    # @schema
    # required: true
    # @schema
    medewerkerIdentificatie:
      # @schema
      # required: true
      # type: string
      # minLength: 1
      # @schema
      # -- (string) The claim used to identify the medewerker in the registers. Default: `email`.<br/>Env: `OIDC_MEDEWERKER_IDENTIFICATIE_CLAIM`
      # <details><summary>More information</summary>When writing data to e.g. Open Klant or Open Zaak, a `medewerkerIdentificatie.identificatie` is required. Municipalities use different values for this. When integrating with e.g. the e-Suite, this must contain the e-Suite username of the logged in KCM.</details>
      # @section -- Authentication and authorization
      claim: ""
      # @schema
      # type: [integer, null]
      # @schema
      # -- (int,null) Optional maximum number of characters of the claim, after which it is truncated. Must be a number (not quoted), for example `24`. Default: no truncation.<br/>Env: `OIDC_MEDEWERKER_IDENTIFICATIE_TRUNCATE`
      # <details><summary>More information</summary>Within ZGW, a `medewerkerIdentificatie.identificatie` may not be longer than 24 characters. Use this setting to truncate the value after 24 characters.</details>
      # @section -- Authentication and authorization
      truncate:
    # -- (string) Name of the role for a Redacteur. Must match the name of the role in the Identity Provider. Default: `Redacteur`. A user with this role can edit Nieuws- en Werkberichten, Links and VACs (if configured). See the [KISS manual](https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/manual/manual.html).<br/>When PABC (`settings.pabc`) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_REDACTEUR_ROLE`
    # @section -- Authentication and authorization
    redacteurRole: ""
    # -- (string) Name of the role for a Beheerder. Must match the name of the role in the Identity Provider. Default: `Beheerder`. A user with this role can edit Skills, Kanalen, Gespreksresultaten and Contactverzoek formulieren. See the [KISS manual](https://kiss-klantinteractie-servicesysteem.readthedocs.io/nl/stable/manual/manual.html).<br/>When PABC (`settings.pabc`) is configured, the role comes from PABC, but KISS only accepts a PABC role with this name. Leave this empty (or use the default) when using PABC.<br/>Env: `OIDC_BEHEERDER_ROLE`
    # @section -- Authentication and authorization
    beheerderRole: ""

  # @schema
  # type: array
  # required: true
  # items:
  #   type: string
  # minItems: 1
  # @schema
  # -- (list) RSIN of the organisation that registers the contactmomenten. Several ZGW APIs, including the Klanten and Contactmomenten APIs, require the RSIN of the own organisation when registering specific objects.<br/>Env: `ORGANISATIE_IDS` (separated by `/`)
  # @section -- Organisation
  organisatieIds: []

  # @schema
  # required: true
  # type: array
  # minItems: 1
  # items:
  #   properties: {}
  #   allOf:
  #     - description: Common register configuration
  #       properties:
  #         isDefault:
  #           type: boolean
  #         zaaksysteem:
  #           properties:
  #             clientId:
  #               type: string
  #               minLength: 1
  #             clientSecret:
  #               type: string
  #               minLength: 1
  #             catalogiBaseUrl:
  #               type: string
  #               minLength: 1
  #             documentenBaseUrl:
  #               type: string
  #               minLength: 1
  #             zakenBaseUrl:
  #               type: string
  #               minLength: 1
  #             deeplink:
  #               properties:
  #                 property:
  #                   type: string
  #                 url:
  #                   type: string
  #             useExperimentalQueries:
  #               type: boolean
  #             usePabc:
  #               type: boolean
  #           required: [clientId, clientSecret, catalogiBaseUrl, documentenBaseUrl, zakenBaseUrl]
  #       required: ["zaaksysteem"]
  #     - oneOf:
  #       - description: Oud (esuite) register configuration
  #         properties:
  #           contactmomenten:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               clientId:
  #                 type: string
  #               clientSecret:
  #                 type: string
  #             required: ["baseUrl", "clientId", "clientSecret"]
  #           interneTaak:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               clientId:
  #                 type: string
  #               clientSecret:
  #                 type: string
  #               objectTypeUrl:
  #                 type: string
  #               objectTypeVersion:
  #                 type: integer
  #             required: ["baseUrl", "clientId", "clientSecret", "objectTypeUrl", "objectTypeVersion"]
  #           klanten:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               clientId:
  #                 type: string
  #               clientSecret:
  #                 type: string
  #             required: ["baseUrl", "clientId", "clientSecret"]
  #         required: ["contactmomenten", "interneTaak", "klanten"]
  #       - description: Nieuw (klantinteracties) register configuration
  #         properties:
  #           klantinteractie:
  #             properties:
  #               baseUrl:
  #                 type: string
  #               token:
  #                 type: string
  #             required: ["baseUrl", "token"]
  #         required: ["klantinteractie"]
  # @schema
  # -- (list) Sets of registers for klantcontacten and zaken. Each set consists of a klantregister, contactmomentregister, contactverzoekregister (interne taak) and a zaaksysteem that belong together. The file `values.schema.json` of this chart describes the possible configurations.<br/>Env: `REGISTERS__<n>__…`, where the first item gets `__0__`, the second `__1__`, and so on.
  # <details><summary>How the sets of registers work</summary><ul>
  # <li>There must be <b>exactly one</b> set with `isDefault: true`. Klanten, contactmomenten and contactverzoeken are created in the default set, unless the context shows that the data belongs in a specific register. For example: if a contactmoment is about a zaak from a certain zaaksysteem, the contactmoment is stored in the contactmomentregister of the same set as that zaaksysteem.</li>
  # <li>A set uses either <b>Open Klant 2</b> (`klantinteractie`) or the <b>e-Suite / Open Klant 1</b> (`contactmomenten`, `klanten` and `interneTaak`). Use Open Klant 1 only to integrate with the e-Suite. The chart derives `REGISTERS__<n>__REGISTRY_VERSION` (`OpenKlant2` or `OpenKlant1`) from this. Without helm, set it yourself: when it is not set, KISS assumes `OpenKlant2`.</li>
  # <li>Secrets marked <b>min. 32 characters</b> below must be at least 32 characters long.</li>
  # </ul></details>
  # <details><summary>Fields of each set</summary><ul>
  # <li>`isDefault` (Env: `REGISTERS__<n>__IS_DEFAULT`): `true` for exactly one set.</li>
  # <li>`zaaksysteem.zakenBaseUrl` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_ZAKEN_BASE_URL`): full base URL of the Zaken API, including the version. Example: `https://zaken.somezaaksysteem.nl/api/v1`</li>
  # <li>`zaaksysteem.catalogiBaseUrl` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_CATALOGI_BASE_URL`): full base URL of the Catalogi API, including the version. Example: `https://catalogi.somezaaksysteem.nl/api/v1`</li>
  # <li>`zaaksysteem.documentenBaseUrl` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_DOCUMENTEN_BASE_URL`): full base URL of the Documenten API, including the version. Example: `https://documenten.somezaaksysteem.nl/api/v1`</li>
  # <li>`zaaksysteem.clientId` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_API_CLIENT_ID`): client ID for the ZGW APIs.</li>
  # <li>`zaaksysteem.clientSecret` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_API_KEY`): secret for the ZGW APIs <b>(min. 32 characters)</b>.</li>
  # <li>`zaaksysteem.deeplink.url` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_DEEPLINK_URL`): optional. Base URL to deeplink to a zaak in the zaaksysteem, for example `https://zaaksysteem.mijngemeente.nl/mp/zaak/`. Always use this <b>in combination with</b> `deeplink.property`. When both are set, the zaak details screen in KISS shows a link that opens the zaak in the zaaksysteem. This only works for zaaksystemen with a fixed URL for zaak details, where only one property of the zaak (e.g. the zaaknummer) has to be appended to that URL.</li>
  # <li>`zaaksysteem.deeplink.property` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_DEEPLINK_PROPERTY`): optional. The property of the zaak whose value is appended to `deeplink.url`, for example `identificatie`. Always use this <b>in combination with</b> `deeplink.url`.</li>
  # <li>`zaaksysteem.useExperimentalQueries` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_USE_EXPERIMENTAL_QUERIES`): optional, `true` or `false`. Feature switch for the experimental features introduced in <a href="https://open-zaak.readthedocs.io/en/stable/development/changelog.html#id9">Open Zaak 1.20.0</a>.</li>
  # <li>`zaaksysteem.usePabc` (Env: `REGISTERS__<n>__ZAAKSYSTEEM_USE_PABC`): optional, default `true`. Whether PABC zaaktype filtering (see `settings.pabc`) is applied to this zaaksysteem. Set to `false` for zaaksystemen with their own authorization (e.g. the e-Suite).</li>
  # <li><b>Open Klant 2:</b></li>
  # <li>`klantinteractie.baseUrl` (Env: `REGISTERS__<n>__KLANTINTERACTIE_BASE_URL`): URL of the Klantinteracties API of the Open Klant 2 register, <b>without</b> `/api/v1` (KISS adds that itself). Example: `https://klantinteractieregister.mijngemeente.nl/klantinteracties`</li>
  # <li>`klantinteractie.token` (Env: `REGISTERS__<n>__KLANTINTERACTIE_TOKEN`): token for the Klantinteracties API.</li>
  # <li><b>e-Suite / Open Klant 1:</b></li>
  # <li>`contactmomenten.baseUrl` (Env: `REGISTERS__<n>__CONTACTMOMENTEN_BASE_URL`): URL of the Contactmomenten API. Example: `https://contactmomentenregister.mijngemeente.nl`</li>
  # <li>`contactmomenten.clientId` (Env: `REGISTERS__<n>__CONTACTMOMENTEN_API_CLIENT_ID`): client ID for the Contactmomenten API.</li>
  # <li>`contactmomenten.clientSecret` (Env: `REGISTERS__<n>__CONTACTMOMENTEN_API_KEY`): key for the Contactmomenten API <b>(min. 32 characters)</b>.</li>
  # <li>`klanten.baseUrl` (Env: `REGISTERS__<n>__KLANTEN_BASE_URL`): URL of the Klanten API. Example: `https://klantenregister.mijngemeente.nl/klanten`</li>
  # <li>`klanten.clientId` (Env: `REGISTERS__<n>__KLANTEN_CLIENT_ID`): client ID for the Klanten API.</li>
  # <li>`klanten.clientSecret` (Env: `REGISTERS__<n>__KLANTEN_CLIENT_SECRET`): secret for the Klanten API <b>(min. 32 characters)</b>.</li>
  # <li>`interneTaak.baseUrl` (Env: `REGISTERS__<n>__INTERNE_TAAK_BASE_URL`): URL of the Objects API for Interne Taken. Example: `https://objectenregister.mijngemeente.nl`</li>
  # <li>`interneTaak.clientId` (Env: `REGISTERS__<n>__INTERNE_TAAK_CLIENT_ID`): client ID for the Objects API for Interne Taken. Usually a token is used; a client ID and secret are needed for example with the e-Suite (podiumd-adapter). Use either a client ID and secret, or a token (`REGISTERS__<n>__INTERNE_TAAK_TOKEN`, see `extraEnvVars`), not both. If both are set, KISS uses the client ID and secret.</li>
  # <li>`interneTaak.clientSecret` (Env: `REGISTERS__<n>__INTERNE_TAAK_CLIENT_SECRET`): client secret for the Objects API for Interne Taken.</li>
  # <li>`interneTaak.objectTypeUrl` (Env: `REGISTERS__<n>__INTERNE_TAAK_OBJECT_TYPE_URL`): URL of the Interne Taak Object Type. Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/f83fdc48-5ddb-4b1a-a347-e20092031399`</li>
  # <li>`interneTaak.objectTypeVersion` (Env: `REGISTERS__<n>__INTERNE_TAAK_TYPE_VERSION`): version number of the Interne Taak Object Type, for example `2`. KISS writes Interne Taken to the Objects API and must send the version of the object type. Which version is the most recent can differ per municipality.</li>
  # </ul></details>
  # <details><summary>Example (Open Klant 2 and Open Zaak)</summary><pre>settings:<br/>  registers:<br/>    - isDefault: true<br/>      klantinteractie:<br/>        baseUrl: "https://klantinteractieregister.mijngemeente.nl/klantinteracties"<br/>        token: "..."<br/>      zaaksysteem:<br/>        zakenBaseUrl: "https://openzaak.mijngemeente.nl/zaken/api/v1"<br/>        catalogiBaseUrl: "https://openzaak.mijngemeente.nl/catalogi/api/v1"<br/>        documentenBaseUrl: "https://openzaak.mijngemeente.nl/documenten/api/v1"<br/>        clientId: "..."<br/>        clientSecret: "..."</pre></details>
  # <details><summary>Migrating from the deprecated ZAAKSYSTEEM_BASE_URL</summary>Older versions of KISS used one variable, `REGISTERS__<n>__ZAAKSYSTEEM_BASE_URL`, for all ZGW APIs. This chart only supports the three separate URLs. KISS itself still accepts the old variable, but don't use the old and new format together. To migrate, replace the single URL by the three base URLs, <b>including the version number</b>. If every API runs on its own subdomain, use for example `https://zaken.mijnzaaksysteem.nl/api/v1`, `https://catalogi.mijnzaaksysteem.nl/api/v1` and `https://documenten.mijnzaaksysteem.nl/api/v1`. If all APIs run on the same URL, use for example `https://openzaak.mijngemeente.nl/zaken/api/v1`, `https://openzaak.mijngemeente.nl/catalogi/api/v1` and `https://openzaak.mijngemeente.nl/documenten/api/v1`.</details>
  # @section -- Registers
  registers: []

  # -- (bool) Determines whether a medewerker must be linked to a contactverzoek when the selected afdeling or groep has no groepsmailbox.<br/>Env: `USE_GROEPSMAILBOX_VERPLICHTING`
  # <details><summary>More information</summary>When `true`, the medewerker field becomes required (with a visible reason) if no email address is known for the selected afdeling or groep. A contactverzoek can then not be created without a medewerker. When `false`, the medewerker field stays optional, regardless of the groepsmailbox.</details>
  # @section -- Feature switches
  groepsmailboxVerplichting: false

  syncJobs:
    image:
      # -- (string) The image repository for the `kiss-elastic-sync` sync jobs
      # @section -- Sync jobs
      repository: "ghcr.io/klantinteractie-servicesysteem/kiss-elastic-sync"
      # -- (string) Pull policy for the `kiss-elastic-sync` image
      # @section -- Sync jobs
      pullPolicy: IfNotPresent
      # -- (string) The tag for the `kiss-elastic-sync` image to use for sync jobs. Consider leaving this empty because it will default to the recommended version to use with the chart.
      # @section -- Sync jobs
      tag: ""
    crawlerImage:
      # -- (string) The image repository for the Elastic Open Crawler
      # @section -- Sync jobs
      repository: "docker.elastic.co/integrations/crawler"
      # -- (string) The tag for the Open Crawler image
      # @section -- Sync jobs
      tag: "1.0.0"
      # -- (string) Pull policy for the Open Crawler image
      # @section -- Sync jobs
      pullPolicy: IfNotPresent
    indexTemplateImage:
      # -- (string) Image used by the pre-install/pre-upgrade hook that registers the `search-website*` index template in Elasticsearch (needs curl).
      # @section -- Sync jobs
      repository: "curlimages/curl"
      # -- (string) The tag for the index-template hook image
      # @section -- Sync jobs
      tag: "8.20.0"
      # -- (string) Pull policy for the index-template hook image
      # @section -- Sync jobs
      pullPolicy: IfNotPresent
