    #       type: string
    #   required: [sourceName, siteUrl, clientId, clientSecret, tenantId]
    # @schema
    # -- (list) SharePoint sync jobs configuration. One sync job is created per item.
    # <details><summary>Fields of each item</summary><ul>
    # <li>`sourceName` (Env: `SHAREPOINT_SOURCE_NAME`): <b>required.</b> A human friendly name for the source, as shown in the search bar in KISS. Example: <i>ICATT SharePoint Test Site</i>.</li>
    # <li>`siteUrl` (Env: `SHAREPOINT_SITE_URL`): <b>required.</b> Full URL of the SharePoint site to crawl, for example `https://my-tenant.sharepoint.com/sites/my-site`. If this is a hub site, or the site has subsites, all underlying / related sites are indexed as well. Both 'modern' site pages and traditional wiki pages are supported.</li>
    # <li>`clientId` (Env: `SHAREPOINT_CLIENT_ID`): <b>required.</b> Client ID (application ID) of the SharePoint app registration. The app registration needs the API permission `Sites.Read.All`. Example: `0166786a-df05-4e1c-a75c-7c3317002ad8`</li>
    # <li>`clientSecret` (Env: `SHAREPOINT_CLIENT_SECRET`): <b>required.</b> Client secret of the SharePoint app registration.</li>
    # <li>`tenantId` (Env: `SHAREPOINT_TENANT_ID`): <b>required.</b> Azure AD tenant ID (GUID) of the SharePoint app registration. Example: `bd7f67dd-fc8c-4a9d-a1aa-c2e4d687b18f`</li>
    # <li>`schedule`: cron schedule of the sync job. Default `*/59 * * * *`</li>
    # <li>`historyLimit`: number of finished jobs to keep. Default `1`</li>
    # <li>`resources`: resources of the sync job container.</li>
    # </ul><b>Reserved source names:</b> don't use `Smoelenboek`, `VAC` or `Kennisbank` as `sourceName`, unless you don't use the corresponding source (a source is not used when it has no configuration). `Smoelenboek` belongs to `settings.syncJobs.medewerkers`, `VAC` to `settings.syncJobs.vac` and `Kennisbank` to `settings.syncJobs.kennisbank`.</details>
    # @section -- Sync jobs
    sharepoint: []

    # @schema
    # type: [object, null]
    # @schema
    vac:
      # -- (bool) Determines whether the navigation item for managing VACs is present in the management navigation.<br/>**Note**: when `true`, the `token` for VACs also needs write permissions, and `objectTypeVersion` must be set to the correct value.<br/>Env: `USE_VACS`
      # @section -- Feature switches
      manageFromKiss: false
      # @schema
      # required: true
      # minLength: 1
      # @schema
      # -- (string) Token for the Objects API for VACs. When `manageFromKiss` is `true`, this token needs read and write permissions.<br/>Env: `VAC_OBJECTEN_TOKEN`
      # @section -- Sync jobs
      token: ""
      # @schema
      # required: true
      # minLength: 1
      # @schema
      # -- (string) URL of the Objects API for VACs.<br/>Example: `https://objectenregister.mijngemeente.nl`<br/>Env: `VAC_OBJECTEN_BASE_URL`
      # @section -- Sync jobs
      baseUrl: ""
      # -- (int) Number of finished jobs to keep.
      # @section -- Sync jobs
      historyLimit: 1
      # @schema
      # required: true
      # minLength: 1
      # @schema
      # -- (string) URL of the VAC Object Type.<br/>Example: `https://objecttypenregister.mijngemeente.nl/api/v2/objecttypes/f83fdc48-5ddb-4b1a-a347-e20092031399`<br/>Env: `VAC_OBJECT_TYPE_URL`
      # @section -- Sync jobs
      objectTypeUrl: ""
      # -- (int) Version number of the VAC Object Type. When `manageFromKiss` is `true`, KISS writes VACs to the Objects API and must send the version of the object type. Which version is the most recent can differ per municipality.<br/>Env: `VAC_OBJECT_TYPE_VERSION`
      # @section -- Sync jobs
      objectTypeVersion: 1
      # -- (object) Resources of the sync job container.
      # @section -- Sync jobs
      resources: {}
      # -- (string) Cron schedule of the sync job.
      # @section -- Sync jobs
      schedule: "*/59 * * * *"

    # @schema
    # items:
    #   type: object
    #   properties:
    #     historyLimit:
    #       type: integer
    #     domain:
    #       type: string
    #       format: uri
    #     schedule:
    #       type: string
    #     sourceName:
    #       type: string
    #     resources:
    #       type: object
    #     outputIndex:
    #       type: string
    #     maxCrawlDepth:
    #       type: integer
    #     maxExtractedLinksCount:
    #       type: integer
    #     maxUniqueUrlCount:
    #       type: integer
    #     purgeCrawlEnabled:
    #       type: boolean
    #     fullHtmlExtractionEnabled:
    #       type: boolean
    #     binaryContentExtractionEnabled:
    #       type: boolean
    #     excludeTags:
    #       type: array
    #       items:
    #         type: string
    #     crawlRules:
    #       type: array
    #       items:
    #         type: object
    #   required: [domain, sourceName]
    # @schema
    # -- (list) Website crawler jobs configuration. Websites are crawled by the [Elastic Open Crawler](https://www.elastic.co/guide/en/elasticsearch/reference/current/es-connectors-crawler.html); one crawler job is created per item. These settings are written to the crawler configuration, there are no KISS environment variables for them.
    # <details><summary>Fields of each item</summary><ul>
    # <li>`domain`: <b>required.</b> Full URL of the website to crawl.</li>
    # <li>`sourceName`: <b>required.</b> A human friendly name for the source, as shown in the search bar in KISS. Example: <i>ICATT Test Site</i>.</li>
    # <li>`outputIndex`: Elasticsearch index to write to. Default: `search-` followed by the `sourceName` in lower case, with spaces replaced by `-`.</li>
    # <li>`excludeTags`: HTML tags whose content is not indexed. Default `["header", "footer", "nav"]`</li>
    # <li>`crawlRules`: <a href="https://github.com/elastic/crawler/blob/main/docs/features/CRAWL_RULES.md">crawl rules</a> of the Open Crawler, to include or exclude parts of the website.</li>
    # <li>`maxCrawlDepth`: maximum crawl depth.</li>
    # <li>`maxExtractedLinksCount`: maximum number of links extracted per page.</li>
    # <li>`maxUniqueUrlCount`: maximum number of unique URLs crawled.</li>
    # <li>`purgeCrawlEnabled`: remove pages from the index that were not found in the last crawl.</li>
    # <li>`fullHtmlExtractionEnabled`: store the full HTML of each page.</li>
    # <li>`binaryContentExtractionEnabled`: extract and index the content of PDF and Word documents.</li>
    # <li>`userAgent`: user agent of the crawler. Default `Kiss-Elastic-Crawler`</li>
    # <li>`threadsPerCrawl`: number of threads per crawl. Default `1`</li>
    # <li>`schedule`: cron schedule of the crawler job. Default `*/59 * * * *`</li>
    # <li>`historyLimit`: number of finished jobs to keep. Default `1`</li>
    # <li>`resources`: resources of the crawler container.</li>
    # </ul><b>Reserved source names:</b> don't use `Smoelenboek`, `VAC` or `Kennisbank` as `sourceName`, unless you don't use the corresponding source (a source is not used when it has no configuration). `Smoelenboek` belongs to `settings.syncJobs.medewerkers`, `VAC` to `settings.syncJobs.vac` and `Kennisbank` to `settings.syncJobs.kennisbank`.<br/><br/>It is advisable to consult your website administrator about fine-tuning the crawler, for example about the robots.txt, a KISS specific sitemap.xml or additional filters.</details>
    # @section -- Sync jobs
    website: []

# -- (list) Optionally specify extra list of additional volumes, for example to trust extra ca certificates.
extraVolumes: []
# e.g:
# extraVolumes:
#   - name: my-secret-mount
#     secret:
#       secretName: my-secret-containing-my-custom-ca

# -- (list) Optionally specify extra list of additional volumeMounts, for example to trust extra ca certificates.
extraVolumeMounts: []
# e.g:
