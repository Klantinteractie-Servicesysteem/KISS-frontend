# -- (list) Array with extra environment variables to add
# <details><summary>Settings without a chart value</summary>KISS supports a few environment variables that this chart doesn't expose as a value. If you need them, set them here. When both a client ID and secret and a token are set, KISS uses the client ID and secret.<ul>
# <li>`AFDELINGEN_CLIENT_ID`, `AFDELINGEN_CLIENT_SECRET`: client ID and secret for the Objects API for afdelingen. The chart requires `settings.afdelingen.token` to be filled in; when the client ID and secret are also set, KISS uses those.</li>
# <li>`GROEPEN_CLIENT_ID`, `GROEPEN_CLIENT_SECRET`: client ID and secret for the Objects API for groepen. The chart requires `settings.groepen.token` to be filled in; when the client ID and secret are also set, KISS uses those.</li>
# <li>`SDG_OBJECTEN_CLIENT_ID`, `SDG_OBJECTEN_CLIENT_SECRET`: client ID and secret for the Objects API for Kennisartikelen (used by the sync job), instead of `settings.syncJobs.kennisbank.token`.</li>
# <li>`VAC_OBJECTEN_CLIENT_ID`, `VAC_OBJECTEN_CLIENT_SECRET`: client ID and secret for the Objects API for VACs (used by the sync job only), instead of `settings.syncJobs.vac.token`.</li>
# <li>`REGISTERS__<n>__INTERNE_TAAK_TOKEN`: token for the Objects API for Interne Taken, instead of `interneTaak.clientId` and `interneTaak.clientSecret`. Leave those two empty when you use the token.</li>
# </ul></details>
extraEnvVars: []
# e.g:
# extraEnvVars:
#   - name: FOO
#     value: "bar"
